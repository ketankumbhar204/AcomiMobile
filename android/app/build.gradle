apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing: load from untracked android/keystore.properties (never commit secrets).
// See android/keystore.properties.example. Do not fall back to the debug keystore for release.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Single source of truth for Play/release versioning: android/version.properties
// Debug/release builds read this file; only bumpVersionCode writes it.
def versionPropertiesFile = rootProject.file("version.properties")
def loadAcomiVersionProperties = {
    if (!versionPropertiesFile.exists()) {
        throw new GradleException(
            "Missing android/version.properties (single source of truth for versionCode/versionName)."
        )
    }
    def props = new Properties()
    versionPropertiesFile.withInputStream { props.load(it) }
    def codeRaw = props.getProperty("VERSION_CODE")
    def nameRaw = props.getProperty("VERSION_NAME")
    if (!codeRaw?.trim() || !nameRaw?.trim()) {
        throw new GradleException(
            "android/version.properties must define non-empty VERSION_CODE and VERSION_NAME."
        )
    }
    def code = codeRaw.trim() as int
    if (code < 1) {
        throw new GradleException("VERSION_CODE must be >= 1 (got ${code}).")
    }
    return [code: code, name: nameRaw.trim()]
}
def acomiVersion = loadAcomiVersionProperties()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.acomi"
    defaultConfig {
        applicationId "com.acomi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode acomiVersion.code
        versionName acomiVersion.name
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            // Play / production artifacts must use the release keystore only.
            // Missing keystore.properties -> assembleRelease/bundleRelease fail (no debug fallback).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            debuggable false
            // minifyEnabled stays behind enableProguardInReleaseBuilds (currently false).
            // Do not enable R8 until a signed release AAB can be used to validate native modules.
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    // lintVitalAnalyzeRelease OOMs (Metaspace) on this host during AppLinksValidDetector.
    // Play packaging does not require this lint task.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Fail fast before native compile when release packaging is requested without signing.
def assertReleaseSigningConfigured = {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException(
            "Release signing is not configured. Create an approved release keystore, " +
            "add android/keystore.properties (see android/keystore.properties.example), " +
            "and ensure the keystore file is not committed to Git. " +
            "Release keystore creation requires explicit user approval."
        )
    }
    def required = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missing = required.findAll { !keystoreProperties.getProperty(it) }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "android/keystore.properties is missing required keys: ${missing.join(', ')}"
        )
    }
    def store = rootProject.file(keystoreProperties['storeFile'])
    if (!store.exists()) {
        throw new GradleException(
            "Release keystore file not found: ${store}. " +
            "Release keystore creation requires explicit user approval."
        )
    }
}

tasks.register("verifyReleaseSigningConfigured") {
    doLast { assertReleaseSigningConfigured() }
}

tasks.register("printVersion") {
    group = "versioning"
    description = "Print ACOMI Android versionCode and versionName from android/version.properties"
    doLast {
        def v = loadAcomiVersionProperties()
        println "ACOMI Android version"
        println "versionCode: ${v.code}"
        println "versionName: ${v.name}"
        println "source: ${versionPropertiesFile.canonicalPath}"
    }
}

// Intentional bump only — never hooked to bundleRelease (avoids wasting Play versionCodes).
// Usage:
//   .\gradlew.bat bumpVersionCode
//   .\gradlew.bat bumpVersionCode -PversionName=1.0.2
tasks.register("bumpVersionCode") {
    group = "versioning"
    description = "Increment VERSION_CODE in android/version.properties (optional -PversionName=...)"
    doLast {
        def v = loadAcomiVersionProperties()
        def nextCode = v.code + 1
        def nextName = project.hasProperty("versionName")
            ? project.property("versionName").toString().trim()
            : v.name
        if (!nextName) {
            throw new GradleException("versionName must not be empty.")
        }
        versionPropertiesFile.setText(
            "# ACOMI Android release version - single source of truth.\n" +
            "# Gradle reads these values for every build (debug and release).\n" +
            "# Do NOT bump VERSION_CODE automatically on bundleRelease.\n" +
            "# Bump intentionally before a Play Store upload:\n" +
            "#   .\\gradlew.bat printVersion\n" +
            "#   .\\gradlew.bat bumpVersionCode\n" +
            "#   .\\gradlew.bat bumpVersionCode -PversionName=1.0.2\n" +
            "#   .\\gradlew.bat printVersion\n" +
            "#   .\\gradlew.bat bundleRelease\n" +
            "VERSION_CODE=${nextCode}\n" +
            "VERSION_NAME=${nextName}\n",
            "UTF-8"
        )
        println "ACOMI Android version bumped"
        println "versionCode: ${v.code} -> ${nextCode}"
        println "versionName: ${nextName}"
        println "source: ${versionPropertiesFile.canonicalPath}"
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackageRequested = graph.allTasks.any { t ->
        t.name == "assembleRelease" || t.name == "bundleRelease"
    }
    if (releasePackageRequested) {
        assertReleaseSigningConfigured()
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // AndroidX Photo Picker / PickVisualMedia (used by react-native-image-picker 8.x).
    // Ensures backport support on devices where the system Photo Picker is not built-in.
    implementation("androidx.activity:activity:1.9.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: "com.google.gms.google-services"
