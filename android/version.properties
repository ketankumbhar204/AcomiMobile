# ACOMI Android release version - single source of truth.
# Gradle reads these values for every build (debug and release).
# Do NOT bump VERSION_CODE automatically on bundleRelease.
# Bump intentionally before a Play Store upload:
#   .\gradlew.bat printVersion
#   .\gradlew.bat bumpVersionCode
#   .\gradlew.bat bumpVersionCode -PversionName=1.0.2
#   .\gradlew.bat printVersion
#   .\gradlew.bat bundleRelease
VERSION_CODE=4
VERSION_NAME=1.0.1
