# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# Single JVM, in-process Kotlin — avoids extra daemon processes on low-RAM Windows hosts.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC

# One worker at a time to keep peak memory low during dex merge.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.configureondemand=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Native ABIs for React Native / CMake.
# - arm64-v8a: real Android phones (Play Store)
# - x86_64: Android emulator (e.g. Pixel_8 debug workflow)
# Override per build if needed, e.g.:
#   .\gradlew.bat assembleRelease -PreactNativeArchitectures=arm64-v8a
# armeabi-v7a omitted for first Play release (modern devices are 64-bit); add later if required.
# Hard-link warnings when Gradle cache is on C: and the project is on K: are harmless.
reactNativeArchitectures=arm64-v8a,x86_64

# React Native 0.82+ always builds with the New Architecture. This property must be
# set so third-party libraries (e.g. @react-native-community/blur) run codegen before CMake.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false
